{% extends "base.html" %}
{% block title %}Access Denied — GitPulse{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:1">
  <div class="glass" style="max-width:400px;width:100%;padding:48px 40px;text-align:center">
    <div style="font-size:56px;margin-bottom:20px">🚫</div>
    <h1 style="font-size:22px;font-weight:700;margin-bottom:8px">Access Denied</h1>
    <p style="color:var(--text-secondary);font-size:14px;margin-bottom:8px">
      <strong style="color:var(--text-primary)">@{{ username }}</strong> is not on the allowed team list.
    </p>
    <p style="color:var(--text-muted);font-size:13px;margin-bottom:32px">
      Contact your admin to be added to <code style="font-family:'JetBrains Mono',monospace;color:var(--text-code)">ALLOWED_GITHUB_USERS</code>.
    </p>
    <a href="/logout" class="btn btn-ghost" style="width:100%;justify-content:center">
      <i class="fa fa-arrow-left"></i> Back to Login
    </a>
  </div>
</div>
{% endblock %}
